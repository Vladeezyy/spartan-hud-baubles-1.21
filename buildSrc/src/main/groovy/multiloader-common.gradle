// Shared by common, neoforge and fabric (after the MultiLoader template by jaredlll08)
plugins {
    id 'java-library'
}

version = "${mod_version}+${minecraft_version}"

base {
    archivesName = project.name == 'common' ? "${mod_id}-common" : "${mod_id}-${project.name}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
}

repositories {
    mavenCentral()
    exclusiveContent {
        forRepositories(
                maven {
                    name = 'ParchmentMC'
                    url = 'https://maven.parchmentmc.org/'
                },
                maven {
                    name = 'NeoForge'
                    url = 'https://maven.neoforged.net/releases'
                }
        )
        filter { includeGroup('org.parchmentmc.data') }
    }
    // Forge Config API Port (Fuzs)
    exclusiveContent {
        forRepository {
            maven {
                name = 'Fuzs Mod Resources'
                url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/'
            }
        }
        filter { includeGroup('fuzs.forgeconfigapiport') }
    }
    maven { url = 'https://maven.blamejared.com/' } // JEI, Patchouli
    maven { url = 'https://maven.theillusivec4.top/' } // Curios
    maven { url = 'https://maven.ladysnake.org/releases' } // Cardinal Components (Trinkets on Fabric)
    maven { url = 'https://maven.terraformersmc.com/' } // Trinkets
    // compatibility checks with other mods, dev runs only
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '100000']
}

jar {
    from(rootProject.file('LICENSE')) { rename { "LICENSE_${mod_id}" } }
    from(rootProject.file('licenses')) { into "licenses/${mod_id}" }
}

processResources {
    var expandProps = [
            'version'                   : version,
            'mod_version'               : mod_version,
            'minecraft_version'         : minecraft_version,
            'minecraft_version_range'   : minecraft_version_range,
            'neo_version_range'         : neo_version_range,
            'curios_version_range'      : curios_version_range,
            'mod_description'           : mod_description,
            'mod_credits'               : mod_credits,
            'mod_authors'               : mod_authors,
            'mod_name'                  : mod_name,
            'mod_id'                    : mod_id,
            'license'                   : mod_license,
            'java_version'              : java_version,
    ]
    filesMatching(['fabric.mod.json', 'META-INF/neoforge.mods.toml', '*.mixins.json']) {
        expand expandProps
    }
    inputs.properties(expandProps)
}
