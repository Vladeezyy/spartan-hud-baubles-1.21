plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}

repositories {
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    // NeoForge's config API and config screen on Fabric (the config of the NeoForge version); a required mod
    modImplementation "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${forgeconfigapiport_version}"
    // Trinkets (required): the accessory slots on Fabric, as Curios on NeoForge
    modImplementation "dev.emi:trinkets:${trinkets_version}"
    // Mod Menu (opens the config screen) in the dev runs only
    modLocalRuntime "maven.modrinth:modmenu:11.0.3"
}

loom {
    runs {
        client {
            client()
            runDir('run')
        }
        server {
            server()
            runDir('run')
        }
        // Scripted test scene (port/DevScene); -Pscene=stress for port/StressScene
        scene {
            client()
            name 'Scene'
            vmArg "-Dspartanhudbaubles.scene=${project.findProperty('scene') ?: 'dev'}"
            vmArg "-Dspartanhudbaubles.scene.lang=${project.findProperty('scene_lang') ?: 'en_us'}"
            runDir('run')
        }
        // Multiplayer check (port/NetScene, tools/nettest.sh)
        netServer {
            server()
            name 'NetServer'
            vmArg '-Dspartanhudbaubles.scene=netserver'
            runDir('run-net')
        }
        netClient {
            client()
            name 'NetClient'
            vmArg '-Dspartanhudbaubles.scene=net'
            programArgs '--quickPlayMultiplayer', 'localhost:25565', '--username', 'Dev'
            runDir('run')
        }
    }
}

tasks.named('jar', Jar).configure {
    exclude 'com/oblivioussp/spartanhudbaubles/port/**'
}
