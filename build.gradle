plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

version = "${mod_version}+${minecraft_version}"
group = mod_group_id

base {
    archivesName = 'SpartanHUDBaubles-neoforge'
}

repositories {
    maven { url = 'https://maven.theillusivec4.top/' } // Curios
    maven { url = 'https://maven.blamejared.com/' } // JEI
    maven {
        url = 'https://api.modrinth.com/maven' // compatibility runs
        content { includeGroup 'maven.modrinth' }
    }
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
        }
        // Scripted test scene (port/DevScene): world run/saves/shb_scene, run/screenshots/scene_*.png, then quits.
        scene {
            client()
            systemProperty 'spartanhudbaubles.scene', project.findProperty('scene') ?: 'dev'
            systemProperty 'spartanhudbaubles.scene.lang', project.findProperty('scene_lang') ?: 'en_us'
        }
        server {
            server()
            programArgument '--nogui'
        }
        // Multiplayer check (port/NetScene, tools/nettest.sh): a dedicated server in run-net/ and a client joining it
        netServer {
            server()
            programArgument '--nogui'
            gameDirectory = project.file('run-net')
        }
        netClient {
            client()
            systemProperty 'spartanhudbaubles.scene', 'net'
            programArguments.addAll('--quickPlayMultiplayer', 'localhost:25565')
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Curios (required): its API at compile time, the full mod in the dev runs
    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}:api"
    localRuntime "top.theillusivec4.curios:curios-neoforge:${curios_version}"
    // JEI needs NeoForge 21.1.238+: -Pno_jei for runs on older NeoForge (-Pneo_version=21.1.197)
    if (!project.hasProperty('no_jei')) {
        localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    }
    // Popular client / performance mods for compatibility runs (-Pwith_compat)
    if (project.hasProperty('with_compat')) {
        localRuntime "maven.modrinth:sodium:${compat_sodium}"
        localRuntime "maven.modrinth:iris:${compat_iris}"
        localRuntime "maven.modrinth:lithium:${compat_lithium}"
        localRuntime "maven.modrinth:ferrite-core:${compat_ferritecore}"
        localRuntime "maven.modrinth:modernfix:${compat_modernfix}"
        localRuntime "maven.modrinth:jade:${compat_jade}"
        localRuntime "maven.modrinth:emi:${compat_emi}"
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version_range      : neo_version_range,
            curios_version_range   : curios_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_credits            : mod_credits,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.named('jar', Jar).configure {
    from('LICENSE') { rename { 'LICENSE_spartanhudbaubles' } }
    from('licenses') { into 'licenses/spartanhudbaubles' }
    // The test scenes (port/) are for dev runs only
    exclude 'com/oblivioussp/spartanhudbaubles/port/**'
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_authors,
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
