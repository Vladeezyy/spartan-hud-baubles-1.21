mod_license=LGPL-3.0-only
mod_version=1.0.0.2
mod_group_id=com.oblivioussp.spartanhudbaubles
mod_authors=ObliviousSpartan
mod_credits=Shivaxi for the ideas to replace Baubles HUD with certain enhancements, and the rest of the RLCraft modpack team for testing and feedback. Port to NeoForge 1.21.1 (Curios) and Fabric 1.21.1 (Trinkets): Vladeezyy
mod_description=Adds a configurable HUD overlay to show equipped Curios (NeoForge) or Trinkets (Fabric). Essentially a replacement mod for Baubles HUD, with enhanced features. Client-side only.

