org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

minecraft_version=1.21.11
minecraft_version_range=[1.21.11]
java_version=21
# NeoForm (vanilla Minecraft for the common project)
neo_form_version=1.21.11-20251209.172050
neo_version=21.11.48
# The oldest NeoForge the jar runs on
neo_version_range=[21.11.48,)

# Curios (required on the client): the 1.21 counterpart of Baubles
curios_version=14.0.0+1.21.11
curios_version_range=[14.0.0,)
jei_version=27.48.0.106
# Common compiles against the API of NeoForge's config (Forge Config API Port's API jar)
forgeconfigapiport_version=21.11.1
# Fabric: Trinkets instead of Curios, NeoForge's config API by Forge Config API Port (both required)

mod_id=spartanhudbaubles
mod_name=Spartan HUD: Baubles
mod_license=LGPL-3.0-only
mod_version=1.0.0.3
mod_group_id=com.oblivioussp.spartanhudbaubles
mod_authors=ObliviousSpartan
mod_credits=Shivaxi for the ideas to replace Baubles HUD with certain enhancements, and the rest of the RLCraft modpack team for testing and feedback. Port to NeoForge 1.21.11 (Curios): Vladeezyy
mod_description=Adds a configurable HUD overlay to show equipped Curios. Essentially a replacement mod for Baubles HUD, with enhanced features. Client-side only.

# Compatibility runs (-Pwith_compat)
compat_sodium=mc1.21.11-0.8.14-neoforge
compat_iris=1.10.8+1.21.11-neoforge
compat_lithium=mc1.21.11-0.21.4-neoforge
compat_ferritecore=8.2.0-neoforge
compat_jade=21.1.7+neoforge
# Fabric compatibility runs (-Pwith_compat on :fabric:runScene; Modrinth version ids where a number is shared with
# other loaders)
