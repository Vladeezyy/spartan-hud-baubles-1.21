org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# 26.x: Gradle itself on JDK 25 (CI removes this line and sets up JDK 25)
org.gradle.java.home=/Users/vladeezy/.gradle/jdks/eclipse_adoptium-25-aarch64-os_x.2/jdk-25.0.4.1+1/Contents/Home

minecraft_version=26.1.2
minecraft_version_range=[26.1.2]
java_version=25
# NeoForm (vanilla Minecraft for the common project); 26.x has no obfuscation and no Parchment
neo_form_version=26.1.2-1
neo_version=26.1.2.122
# The oldest NeoForge the jar runs on
neo_version_range=[26.1.2.122,)

# Curios (required on the client): the 1.21 counterpart of Baubles
curios_version=15.0.0+26.1.2
curios_version_range=[15.0.0,)
jei_version=29.47.0.111
# Common compiles against the API of NeoForge's config (Forge Config API Port's API jar)
forgeconfigapiport_version=26.1.5
# Fabric: Trinkets instead of Curios, NeoForge's config API by Forge Config API Port (both required)

mod_id=spartanhudbaubles
mod_name=Spartan HUD: Baubles
mod_license=LGPL-3.0-only
mod_version=1.0.0.3
mod_group_id=com.oblivioussp.spartanhudbaubles
mod_authors=ObliviousSpartan
mod_credits=Shivaxi for the ideas to replace Baubles HUD with certain enhancements, and the rest of the RLCraft modpack team for testing and feedback. Port to NeoForge 26.1.2 (Curios): Vladeezyy
mod_description=Adds a configurable HUD overlay to show equipped Curios. Essentially a replacement mod for Baubles HUD, with enhanced features. Client-side only.

# Compatibility runs (-Pwith_compat)
compat_sodium=mc26.1.2-0.9.2-neoforge
compat_iris=1.11.4+26.1-neoforge
compat_lithium=mc26.1.2-0.24.7-neoforge
compat_ferritecore=9.0.0-neoforge
compat_jade=26.1.12+neoforge
# Fabric compatibility runs (-Pwith_compat on :fabric:runScene; Modrinth version ids where a number is shared with
# other loaders)
